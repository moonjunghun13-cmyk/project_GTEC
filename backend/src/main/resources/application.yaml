
spring:
  application:
    name: mall

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gtec}
    username: ${USER_NAME}
    password: ${PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
    show-sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

          kakao:
            provider: kakao
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - account_email
              - profile_nickname
            client-name: Kakao

          naver:
            provider: naver
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - name
              - email
            client-name: Naver

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

jwt:
  secret: ${JWT_SECRET}

toss:
  payments:
    secret-key: ${TOSS_SECRET_KEY}

app:
  ai:
    recommend-url: ${AI_RECOMMEND_URL:http://127.0.0.1:8002}
    review-url: ${AI_REVIEW_URL:http://127.0.0.1:8003}
    customer-url: ${AI_CUSTOMER_URL:http://127.0.0.1:8001}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Spring Boot REST
        url: /v3/api-docs
      - name: AI 추천
        url: http://localhost:8002/openapi.json
      - name: AI 리뷰 분석
        url: http://localhost:8003/openapi.json
      - name: AI 고객 분석
        url: http://localhost:8001/openapi.json

server:
  port: 8090
